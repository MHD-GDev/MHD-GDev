<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">MHD-GDev</title>
  <desc id="desc">A dark graphite banner with a subtle animated aurora, grid, and terminal-inspired typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10131b"/><stop offset=".55" stop-color="#191a2b"/><stop offset="1" stop-color="#101d25"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#8b7cff" stop-opacity="0"/><stop offset=".5" stop-color="#8b7cff" stop-opacity=".9"/><stop offset="1" stop-color="#70d6c7" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse"><path d="M42 0H0V42" fill="none" stroke="#b6c1df" stroke-opacity=".075" stroke-width="1"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="22" fill="url(#grid)"/>
  <g filter="url(#blur)" opacity=".8">
    <ellipse cx="260" cy="90" rx="210" ry="90" fill="#7967ff" opacity=".24"><animate attributeName="cx" values="260;420;260" dur="14s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="930" cy="260" rx="240" ry="100" fill="#4bc8b6" opacity=".17"><animate attributeName="cx" values="930;770;930" dur="17s" repeatCount="indefinite"/></ellipse>
  </g>
  <path d="M0 270 C240 230 360 320 600 270 S960 220 1200 270" fill="none" stroke="url(#line)" stroke-width="1.5" opacity=".65">
    <animate attributeName="d" dur="12s" repeatCount="indefinite" values="M0 270 C240 230 360 320 600 270 S960 220 1200 270;M0 260 C240 300 360 220 600 260 S960 310 1200 250;M0 270 C240 230 360 320 600 270 S960 220 1200 270"/>
  </path>
  <g transform="translate(88 88)">
    <rect x="0" y="0" width="52" height="4" rx="2" fill="#70d6c7"/>
    <text x="0" y="88" fill="#f1f2fa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="66" font-weight="700" letter-spacing="-3">MHD<tspan fill="#8b7cff">-</tspan>GDev</text>
    <text x="4" y="130" fill="#aeb4c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19" letter-spacing="3">LOCAL-FIRST TOOLS / LINUX / NEOVIM / AI</text>
    <text x="4" y="183" fill="#70d6c7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">[ curiosity in, useful software out ]</text>
  </g>
  <g transform="translate(1000 72)" opacity=".82">
    <circle cx="0" cy="0" r="54" fill="none" stroke="#8b7cff" stroke-opacity=".38"/>
    <circle cx="0" cy="0" r="39" fill="none" stroke="#70d6c7" stroke-opacity=".5" stroke-dasharray="3 8"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/></circle>
    <circle cx="0" cy="0" r="7" fill="#70d6c7"><animate attributeName="opacity" values=".45;1;.45" dur="3s" repeatCount="indefinite"/></circle>
  </g>
  <text x="1110" y="310" fill="#8a90a0" font-family="ui-monospace, monospace" font-size="11" text-anchor="end" letter-spacing="2">MHD / 001</text>
</svg>